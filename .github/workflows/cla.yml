name: CLA Assistant

# Prompts external contributors to sign the CLA on their first PR.
# Maintainer (HBarefoot) and bots are exempt via the allowlist.
# Signatures land on a separate `cla-signatures` branch of this repo,
# auto-created by the action; storage is one JSON file per CLA version.
# Re-prompting: comment `recheck` on a PR to refresh the check.
# See CLA.md for the agreement text and signing instructions.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: |
          (github.event.comment.body == 'recheck'
            || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://github.com/HBarefoot/engram/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: HBarefoot,dependabot[bot]
          # Signatures live on the `cla-signatures` branch of THIS repo, so the
          # default GITHUB_TOKEN (with contents:write above) suffices. The
          # remote-organization-name / remote-repository-name inputs were
          # removed: they make the action target a *separate* repo and demand a
          # PERSONAL_ACCESS_TOKEN, which failed every run with "Please add a
          # personal access token … for writing signatures in a remote repo".
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✓'
