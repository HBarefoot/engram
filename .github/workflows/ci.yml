name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Build dashboard
        run: npm run build

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Embedding-dependent suites download Xenova/all-MiniLM-L6-v2 (~23 MB) from
      # HuggingFace. Cache it + warm it (with retry) so a transient HF outage
      # doesn't fail unrelated PRs.
      #
      # @xenova/transformers resolves its cache from env.cacheDir (it ignores the
      # TRANSFORMERS_CACHE env var), so the warm-up sets env.cacheDir =
      # ~/.cache/huggingface and the model lands at
      # ~/.cache/huggingface/Xenova/all-MiniLM-L6-v2. The tests read that path
      # because src/embed/index.js getKnownModelSources includes
      # process.env.TRANSFORMERS_CACHE/Xenova/... — so we ALSO export
      # TRANSFORMERS_CACHE=~/.cache/huggingface for the test step, and
      # seedModelCache copies the model into each test's temp dir (offline).
      - name: Point the embedding cache at ~/.cache/huggingface
        run: echo "TRANSFORMERS_CACHE=$HOME/.cache/huggingface" >> "$GITHUB_ENV"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-all-MiniLM-L6-v2-v2

      - name: Warm embedding model (downloads once on cache miss; retries on transient HF errors)
        run: |
          for attempt in 1 2 3; do
            if node -e "import('@xenova/transformers').then(async ({ env, pipeline }) => { env.cacheDir = process.env.TRANSFORMERS_CACHE; const p = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', { quantized: true }); await p('warm-up', { pooling: 'mean', normalize: true }); console.log('embedding model ready'); }).catch(e => { console.error('warm-up failed:', e.message); process.exit(1); })"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$(( attempt == 1 ? 5 : 15 ))
              echo "warm-up attempt $attempt failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "::warning::Embedding model warm-up failed after 3 attempts (HuggingFace may be unavailable); tests may fail if the cache is cold."
          exit 0

      - name: Run tests
        run: npm run test:run
