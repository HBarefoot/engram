name: Build Desktop App

# Builds the macOS desktop app and attaches the .dmg + zipped .app to the
# GitHub Release that triggered it — so every `vX.Y.Z` release ships both the
# npm package (publish.yml) and the desktop artifacts. Also runnable manually
# via workflow_dispatch (build-only; no release upload).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: cd desktop && npm ci

      - name: Build sidecar
        run: npm run build:sidecar

      - name: Build Tauri app (Apple Silicon)
        run: cd desktop && npm run tauri build -- --target aarch64-apple-darwin

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"
          else
            v="$(node -p "require('./desktop/package.json').version")"
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Zip the .app bundle (preserving permissions)
        run: |
          cd desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          zip -r -y "Engram_${{ steps.version.outputs.version }}_arm64.app.zip" Engram.app

      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: Engram-macos
          path: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.zip
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach assets to the triggering release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.zip
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
